name: Compatibility report
description: How a game runs on your Mac (the app fills most of this in).
labels: [report]
title: "Game title"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing how a game runs. Fields are filled in by KLYC-Box ("Share…" on the game's page). Only the frame rate is yours to read off the screen.
  - type: input
    id: steam_appid
    attributes:
      label: Steam app id
      description: Leave empty for games that are not on Steam.
  - type: dropdown
    id: works
    attributes:
      label: Does it work?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: input
    id: fps
    attributes:
      label: Frames per second you saw (optional)
  - type: input
    id: renderer
    attributes:
      label: Graphics mode
  - type: input
    id: chip
    attributes:
      label: Chip
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine
  - type: input
    id: version
    attributes:
      label: KLYC-Box version
  - type: textarea
    id: settings
    attributes:
      label: Environment settings
  - type: textarea
    id: notes
    attributes:
      label: Notes
